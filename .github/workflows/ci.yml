name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Install Playwright browsers
        run: vp exec playwright install --with-deps
      - name: Check
        run: vp check
      - name: Test
        run: vp test
      - name: Build
        run: vp build
      - name: E2E tests
        run: vp run test:e2e
